# GitHub Actions Workflow - Level 4: Firebase App Distribution
# Automatically distributes builds to testers via Firebase
# Perfect for: Beta testing, internal releases
#
# SETUP REQUIRED:
# 1. Set up Firebase App Distribution
# 2. Generate Firebase service account JSON
# 3. Add these secrets:
#    - FIREBASE_APP_ID: Your Firebase app ID
#    - FIREBASE_SERVICE_ACCOUNT: Service account JSON (base64 encoded)
#
# To get Firebase App ID:
#   Firebase Console > Project Settings > General > Your apps
#
# To create service account:
#   Firebase Console > Project Settings > Service accounts > Generate new private key

name: 04 - Firebase Distribution

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  distribute:
    name: Build and Distribute to Firebase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Get version info
      - name: Get version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk '{print $3}' | tr -d '"')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk '{print $3}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
      
      # Build debug APK (for testing)
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      # Upload to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Version: ${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }})
            
            Changes:
            ${{ github.event.head_commit.message }}
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}

