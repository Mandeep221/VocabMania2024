# GitHub Actions Workflow - Level 1: Basic Build
# This is the simplest CI workflow - just builds the app
# Perfect for: Learning GitHub Actions basics, ensuring code compiles

name: 01 - Basic Build

# When to run this workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up JDK 17 (required for Android development)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # Step 3: Grant execute permission to gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Step 4: Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      # Step 5: Upload APK as artifact (so you can download it)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

