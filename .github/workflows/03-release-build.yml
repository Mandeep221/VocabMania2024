# GitHub Actions Workflow - Level 3: Release Build with Signing
# Creates signed release APK/AAB
# Perfect for: Production releases, Play Store deployment
#
# SETUP REQUIRED:
# 1. Go to Settings > Secrets and variables > Actions
# 2. Add these secrets:
#    - KEYSTORE_BASE64: Base64 encoded keystore file
#    - KEYSTORE_PASSWORD: Keystore password
#    - KEY_ALIAS: Key alias
#    - KEY_PASSWORD: Key password
#
# To create KEYSTORE_BASE64:
#   base64 -i mykey.jks | pbcopy  (macOS)
#   base64 mykey.jks | clip       (Windows)

name: 03 - Release Build

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger

jobs:
  release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Decode keystore from secrets
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > keystore.jks
      
      # Create key.properties file
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=../keystore.jks" >> key.properties
      
      # Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      
      # Build release AAB (for Play Store)
      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace
      
      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      
      # Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      # Optional: Create GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

